<!DOCTYPE html>
<html>
<head><title>WTC Icon Generator</title></head>
<body style="font-family:sans-serif;padding:40px;background:#f5f5f5">
<h2>WTC Apple Touch Icon Generator</h2>
<canvas id="c" width="180" height="180" style="border-radius:40px;display:block;margin:20px 0"></canvas>
<button onclick="download()" style="padding:12px 24px;background:#1B2A4A;color:white;border:none;border-radius:8px;cursor:pointer;font-size:16px">Download apple-touch-icon.png</button>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');

// Background
ctx.fillStyle = '#1B2A4A';
roundRect(ctx, 0, 0, 180, 180, 40);
ctx.fill();

// Cross — vertical
ctx.fillStyle = '#C2738A';
roundRect(ctx, 82, 30, 16, 120, 4);
ctx.fill();

// Cross — horizontal
roundRect(ctx, 48, 66, 84, 16, 4);
ctx.fill();

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function download() {
  const a = document.createElement('a');
  a.download = 'apple-touch-icon.png';
  a.href = c.toDataURL('image/png');
  a.click();
}
</script>
</body>
</html>
